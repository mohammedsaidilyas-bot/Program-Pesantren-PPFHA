<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrasi Data Wajah Lokal</title><style>body{font-family:Arial,sans-serif;background:#10202b;color:#edf6f8;margin:0;padding:18px}main{max-width:700px;margin:auto;background:#18313f;padding:20px;border-radius:16px}button{padding:12px;margin:5px;border-radius:10px;border:0;font-weight:bold}pre{white-space:pre-wrap;word-break:break-word;background:#0b1720;padding:12px;border-radius:10px}input{padding:12px;width:90%;margin:8px 0}label{display:block;margin:12px 0}</style></head><body><main><h2>Ambil Data Wajah dari Browser</h2><p>Halaman ini membaca penyimpanan lokal pada origin portal yang sama. Data lokal tidak dihapus.</p><button id="scan">1. Baca Data Lokal</button><button id="export">2. Ekspor JSON</button><pre id="status">Tekan Baca Data Lokal.</pre><label><input id="consent" type="checkbox">Saya memastikan migrasi biometrik dilakukan dengan persetujuan yang sesuai.</label><label>Kunci FACE_API_KEY<input id="key" type="password" autocomplete="off"></label><button id="send">3. Kirim data ke Google Sheet</button><pre id="result"></pre></main><script>
(function(){'use strict';const API='https://script.google.com/macros/s/AKfycbwgGOvBV8fKNBamDVYNBAgMeFS6-ld0nfjU2OCkbFFxTCEMSRZAf7nSW7Odj5OYxEWQ/exec';let records=[];
function nis(v){return String(v||'').replace(/\\D/g,'').trim()}function valid(v){return Array.isArray(v)&&v.length===128&&v.every(x=>x!==null&&x!==''&&isFinite(Number(x)))}
function scan(){const found=new Map();function walk(x,depth,n,key){if(depth>10||x==null)return;if(Array.isArray(x)){x.forEach((v,i)=>walk(v,depth+1,n,key+'['+i+']'));return;}if(typeof x!=='object')return;let nn=nis(x.nis||x.NIS||x.idSantri||x.studentId||x.nomorInduk||n);for(let k of Object.keys(x)){let v=x[k];if(valid(v)&&nn&&!found.has(nn))found.set(nn,{nis:nn,descriptor:v.map(Number)});else walk(v,depth+1,nn,key+'.'+k);}let d=x.descriptor||x.faceDescriptor||x.embedding||x.vector;if(valid(d)&&nn&&!found.has(nn))found.set(nn,{nis:nn,descriptor:d.map(Number)});}for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i),raw=localStorage.getItem(k);try{let p=JSON.parse(raw),kn=nis((k.match(/\\d{5,}/)||[])[0]);walk(p,0,kn,k);if(valid(p)&&kn&&!found.has(kn))found.set(kn,{nis:kn,descriptor:p.map(Number)});}catch(_){}}records=[...found.values()];document.getElementById('status').textContent='Ditemukan '+records.length+' NIS: '+records.map(r=>r.nis).join(', ')+'\\n\\nTidak ada data lokal yang dihapus.';return records;}
document.getElementById('scan').onclick=scan;document.getElementById('export').onclick=function(){if(!records.length)scan();if(!records.length){alert('Data tidak ditemukan.');return;}let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='face-descriptors-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
document.getElementById('send').onclick=async function(){let out=document.getElementById('result');if(!records.length)scan();if(!records.length){out.textContent='Data lokal tidak ditemukan.';return;}if(!document.getElementById('consent').checked){out.textContent='Konfirmasi persetujuan diperlukan.';return;}let key=document.getElementById('key').value;if(!key){out.textContent='Isi kunci FACE_API_KEY.';return;}this.disabled=true;let sent=0,failed=[];try{for(let r of records){try{let response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'faceEnroll',apiKey:key,data:{nis:r.nis,descriptor:r.descriptor,consent:true,consentAt:new Date().toISOString()}})});let data=await response.json();if(data&&data.ok)sent++;else failed.push(r.nis+': '+(data.error||'gagal'));}catch(e){failed.push(r.nis+': '+e.message);}}out.textContent='Berhasil dikirim: '+sent+'\\nGagal: '+failed.length+'\\n'+failed.join('\\n')+'\\nData lokal tidak dihapus.';}finally{this.disabled=false;}};scan();})();
</script></body></html>
